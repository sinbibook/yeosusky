<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 placeholder 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>여수 스카이펜션</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <style>
      .error_wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 70vh;
        text-align: center;
        padding: 200px 20px 120px;
      }
      .error_wrap .error_code {
        font-size: 120px;
        line-height: 1;
        margin-bottom: 20px;
        letter-spacing: -4px;
        color: var(--color-secondary);
        font-family: var(--font-en-main);
      }
      .error_wrap .error_title {
        font-size: 24px;
        color: #333;
        margin-bottom: 14px;
        font-family: var(--font-ko-main);
      }
      .error_wrap .error_msg {
        font-size: 15px;
        color: #6a747d;
        line-height: 1.8;
        margin-bottom: 40px;
      }
      .error_wrap .btn_home {
        display: inline-block;
        font-size: 15px;
        line-height: 3;
        padding: 0 3em;
        color: #fff;
        background: var(--color-secondary);
        transition: all 0.3s;
      }
      .error_wrap .btn_home:hover {
        opacity: 0.85;
      }
      @media only screen and (max-width: 640px) {
        .error_wrap {
          padding: 140px 20px 80px;
        }
        .error_wrap .error_code {
          font-size: 80px;
        }
        .error_wrap .error_title {
          font-size: 20px;
        }
      }
    </style>
    <!-- Open Graph Meta Tags for Social Media -->

  <meta property="og:url" content="https://yeosusky.com" />

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">

          <div>
            <div class="error_code">404</div>
            <h1 class="error_title">페이지를 찾을 수 없습니다.</h1>
            <p class="error_msg">
              요청하신 페이지가 존재하지 않거나 비활성화되었습니다.
